function applyLanguage(lang){
 const t=R[lang]||R.en;
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-i18n]").forEach(el=>{const v=t[el.dataset.i18n];if(v!==undefined)el.innerHTML=v});
 const select=document.getElementById("languageSelect");if(select)select.value=lang;
 localStorage.setItem("portfolio-language",lang);
}
function detectLanguage(){
 const saved=localStorage.getItem("portfolio-language");
 if(saved&&R[saved])return saved;
 const browser=(navigator.language||"en").toLowerCase().split("-")[0];
 return R[browser]?browser:"en";
}document.addEventListener("DOMContentLoaded",()=>{
 applyLanguage(detectLanguage());
 const select=document.getElementById("languageSelect");
 if(select)select.addEventListener("change",e=>applyLanguage(e.target.value));
});
